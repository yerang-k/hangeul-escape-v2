<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>훈민정음 대탈출 — 교사용 실시간 조감도 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Gothic:wght@400;700&display=swap');
    body {
      font-family: 'Nanum Gothic', sans-serif;
      background-color: #f7f3ed; /* 포근하고 밝은 전통 한지 톤 배경 */
      color: #2b221a; /* 짙은 먹색 텍스트 */
    }
    .myeongjo {
      font-family: 'Nanum Myeongjo', serif;
    }
    .stagnant-pulse {
      animation: borderPulse 1.2s infinite alternate;
    }
    @keyframes borderPulse {
      0% {
        border-color: #c62828;
        box-shadow: 0 0 4px rgba(198, 40, 40, 0.4);
        background-color: rgba(254, 226, 226, 0.6);
      }
      100% {
        border-color: #ef4444;
        box-shadow: 0 0 16px rgba(239, 68, 68, 0.85);
        background-color: rgba(254, 226, 226, 1);
      }
    }
    .student-chip {
      transition: left 0.9s linear, top 0.9s linear;
    }
    .no-transition {
      transition: none !important;
    }
  </style>
</head>
<body class="p-4 md:p-6 max-w-[1600px] mx-auto transition-all duration-300">
  <!-- 상단 헤더 (전통 베이지톤 테마) -->
  <header class="flex flex-col md:flex-row justify-between items-center border-b border-[#dfd5c6] pb-4 mb-6 gap-4">
    <div class="flex items-center gap-3">
      <span class="text-4xl">👨‍🏫</span>
      <div>
        <h1 class="text-2xl font-extrabold text-[#8c6239] myeongjo">훈민정음 대탈출</h1>
        <p class="text-xs text-[#a67c52] font-semibold">실시간 학급별 조감도 모니터링 대시보드</p>
      </div>
    </div>
    
    <!-- 반 선택 드롭다운 및 토글 -->
    <div class="flex items-center gap-3">
      <label for="classSelect" class="text-sm font-bold text-[#8c6239] myeongjo">학급 선택:</label>
      <select id="classSelect" class="bg-white border-2 border-[#dfd5c6] text-[#5c4033] font-bold rounded-lg px-3 py-1.5 focus:outline-none focus:border-[#8c6239] shadow-sm">
      </select>
      
      <!-- 리스트뷰 토글 버튼 -->
      <button id="toggleListBtn" class="bg-[#f0e6d6] hover:bg-[#e8dbcc] border border-[#dfd5c6] text-[#5c4033] font-bold text-xs px-4 py-2 rounded-lg transition-all flex items-center gap-1.5 shadow-sm">
        <span>📋</span> <span id="toggleText">현황판 접기</span>
      </button>
    </div>
  </header>

  <!-- 메인 모니터링 패널 -->
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 transition-all duration-300" id="mainGrid">
    <!-- 실시간 공간 조감도 뷰 (2열 또는 3열 전체 차지) -->
    <section class="lg:col-span-2 space-y-6 transition-all duration-300" id="mapSection">
      <div class="bg-white border border-[#dfd5c6] rounded-xl p-5 shadow-lg">
        <h2 class="text-lg font-bold text-[#8c6239] myeongjo mb-4 flex items-center justify-between">
          <span>🗺️ 실시간 2D 조감도 미니맵</span>
          <span class="text-xs text-stone-500 font-normal">* 가구 및 장애물 실제 좌표 1:1 매핑 완료</span>
        </h2>
        
        <!-- 4개 방 조감도 그리드 (2x2) -->
        <div class="grid grid-cols-2 gap-5" id="roomMapsGrid">
          <!-- 스크립트에서 각 방의 조감도가 생성됩니다. -->
        </div>

        <!-- 최종 완주 성공 구역 (에메랄드 톤 포인트) -->
        <div class="mt-6 border-t border-[#dfd5c6] pt-4">
          <h3 class="text-sm font-bold text-emerald-700 myeongjo mb-3 flex items-center gap-1.5">
            <span>🎉</span> 최종 탈출 성공 명단
          </h3>
          <div class="bg-emerald-50/50 border border-emerald-100 rounded-xl p-4 flex flex-wrap gap-2 min-h-[60px]" id="winRoomArea">
            <div class="text-stone-400 text-xs my-auto italic">아직 완주한 학생이 없습니다.</div>
          </div>
        </div>
      </div>
      
      <!-- 요약 정보 / 범례 -->
      <div class="bg-white/60 border border-[#dfd5c6]/60 rounded-xl p-4 flex flex-wrap gap-5 text-xs text-stone-650">
        <div class="flex items-center gap-1.5">
          <span class="inline-block w-3.5 h-3.5 bg-blue-600 rounded-full"></span>
          <span>진행 중 학생</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="inline-block w-3.5 h-3.5 bg-red-600 rounded-full stagnant-pulse"></span>
          <span>3분 이상 정체 (교사 확인 요망)</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="inline-block w-3.5 h-3.5 bg-emerald-600 rounded"></span>
          <span>최종 완주자</span>
        </div>
        <div class="ml-auto text-stone-500 font-medium">
          * 학생의 실제 이동에 맞추어 이름 칩이 동적으로 미끄러지며 이동합니다.
        </div>
      </div>
    </section>

    <!-- 학생 전체 리스트 뷰 (1열 차지) -->
    <section class="bg-white border border-[#dfd5c6] rounded-xl p-5 shadow-lg transition-all duration-300" id="listSection">
      <h2 class="text-lg font-bold text-[#8c6239] myeongjo mb-4 flex items-center justify-between border-b border-stone-100 pb-2">
        <span class="flex items-center gap-2">📋 전체 현황판 (리스트 뷰)</span>
        <span id="studentCount" class="text-xs bg-[#fbf9f6] border border-[#dfd5c6] px-2.5 py-1 rounded-md text-[#8c6239] font-bold">0명 참여 중</span>
      </h2>
      
      <div class="space-y-3 overflow-y-auto max-h-[75vh] pr-2" id="studentList">
      </div>
    </section>
  </div>

  <script>
    // Firebase Config
    const CONFIG = {
      FIREBASE: { apiKey: "AIzaSyBL5S89ZPrwPcxE0SNYOU-7wbkhesNBKkQ", authDomain: "hangeul-escape.firebaseapp.com", databaseURL: "https://hangeul-escape-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "hangeul-escape" }
    };
    
    let db = null;
    let currentClass = '1-1';
    let studentsData = {};
    const ROOM_NAMES = ['제1방 (창제의 방)', '제2방 (규범의 방)', '제3방 (보물의 방)', '제4방 (한글날의 방)'];
    
    // 3D 맵 실제 장애물 정보 (x, z, w, d)
    const ROOM_BLOCKS = [
      // 1방
      [{x:2,z:-2,w:1.6,d:18}],
      // 2방
      [{x:-3,z:-1,w:12,d:1.6},{x:6,z:-8,w:1.6,d:12}],
      // 3방
      [{x:-5,z:-6,w:1.6,d:14},{x:6,z:-6,w:1.6,d:14}],
      // 4방
      [{x:0,z:-7,w:12,d:1.6},{x:-6,z:-2,w:1.6,d:10},{x:6,z:-2,w:1.6,d:10}]
    ];

    // 방별 가구 목록 및 실제 좌표 규격 (x, z, w, d) - 가독성을 극대화한 명칭
    const ROOM_FURNITURES = [
      // 1방
      [
        { name: '서안', build: 'desk', x: -9, z: -9, w: 3.0, d: 1.8 },
        { name: '족자', build: 'scroll', x: -8, z: -15.2, w: 2.2, d: 0.8 },
        { name: '서랍장', build: 'drawer', x: 10, z: -11, w: 2.4, d: 1.6 },
        { name: '서궤', build: 'chest', x: 12, z: 7, w: 2.6, d: 1.8 },
        { name: '놋 항아리', build: 'jar', x: 13, z: -2, w: 1.8, d: 1.8 },
        { name: '봉인 궤', build: 'chest', x: -13, z: -2, w: 2.6, d: 1.8 },
        { name: '학사 👨‍🏫', build: 'npc', x: -4, z: 4, w: 1.8, d: 1.8 },
        { name: '금고문 🔐', build: 'door', x: 0, z: 15.2, w: 3.6, d: 1.0 }
      ],
      // 2방
      [
        { name: '검사대', build: 'drawer', x: -12, z: -3, w: 2.4, d: 1.6 },
        { name: '족자', build: 'scroll', x: 9, z: -15.2, w: 2.2, d: 0.8 },
        { name: '표기대', build: 'desk', x: 12, z: 5, w: 3.0, d: 1.8 },
        { name: '규정 궤', build: 'chest', x: -6, z: 10, w: 2.6, d: 1.8 },
        { name: '항아리', build: 'jar', x: -13, z: 2, w: 1.8, d: 1.8 },
        { name: '서류함', build: 'chest', x: 12, z: 3, w: 2.6, d: 1.8 },
        { name: '규범관 🧐', build: 'npc', x: -4, z: 4, w: 1.8, d: 1.8 },
        { name: '금고문 🔐', build: 'door', x: 0, z: 15.2, w: 3.6, d: 1.0 }
      ],
      // 3방
      [
        { name: '황금 단지', build: 'jar', x: -13, z: -5, w: 1.8, d: 1.8 },
        { name: '두루마리', build: 'scroll', x: -6, z: -15.2, w: 2.2, d: 0.8 },
        { name: '유물 서랍', build: 'drawer', x: 13, z: -9, w: 2.4, d: 1.6 },
        { name: '청동 향로', build: 'jar', x: 12, z: 9, w: 1.8, d: 1.8 },
        { name: '보물궤', build: 'chest', x: -11, z: 11, w: 2.6, d: 1.8 },
        { name: '옥합', build: 'jar', x: 12, z: 3, w: 1.8, d: 1.8 },
        { name: '지킴이 🧙', build: 'npc', x: -4, z: 4, w: 1.8, d: 1.8 },
        { name: '금고문 🔐', build: 'door', x: 0, z: 15.2, w: 3.6, d: 1.0 }
      ],
      // 4방
      [
        { name: '기념 서안', build: 'desk', x: -10, z: -8, w: 3.0, d: 1.8 },
        { name: '선언 족자', build: 'scroll', x: 0, z: -15.2, w: 2.2, d: 0.8 },
        { name: '간송의 궤', build: 'chest', x: 11, z: -6, w: 2.6, d: 1.8 },
        { name: '글자 서랍', build: 'drawer', x: 9, z: 9, w: 2.4, d: 1.6 },
        { name: '달력 단지', build: 'jar', x: -13, z: 2, w: 1.8, d: 1.8 },
        { name: '연대기', build: 'chest', x: 13, z: 2, w: 2.6, d: 1.8 },
        { name: '지킴이 📖', build: 'npc', x: -4, z: 4, w: 1.8, d: 1.8 },
        { name: '최후금고문 🔐', build: 'door', x: 0, z: 15.2, w: 3.6, d: 1.0 }
      ]
    ];

    const classSelect = document.getElementById('classSelect');
    const roomMapsGrid = document.getElementById('roomMapsGrid');
    const winRoomArea = document.getElementById('winRoomArea');
    const studentList = document.getElementById('studentList');
    const studentCount = document.getElementById('studentCount');
    const toggleListBtn = document.getElementById('toggleListBtn');
    const toggleText = document.getElementById('toggleText');
    const mainGrid = document.getElementById('mainGrid');
    const mapSection = document.getElementById('mapSection');
    const listSection = document.getElementById('listSection');
    
    // 학급 선택 생성 (1~3학년, 학년당 1~10반)
    for(let grade = 1; grade <= 3; grade++) {
      for(let cls = 1; cls <= 10; cls++) {
        const val = `${grade}-${cls}`;
        const opt = document.createElement('option');
        opt.value = val;
        opt.textContent = `${grade}학년 ${cls}반`;
        classSelect.appendChild(opt);
      }
    }
    
    // 리스트 뷰 토글
    let isCollapsed = false;
    toggleListBtn.addEventListener('click', () => {
      isCollapsed = !isCollapsed;
      if (isCollapsed) {
        listSection.classList.add('hidden');
        mapSection.classList.replace('lg:col-span-2', 'lg:col-span-3');
        toggleText.textContent = "현황판 펴기";
      } else {
        listSection.classList.remove('hidden');
        mapSection.classList.replace('lg:col-span-3', 'lg:col-span-2');
        toggleText.textContent = "현황판 접기";
      }
      setTimeout(renderDashboard, 100);
    });

    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }
    
    const classParam = getQueryParam('class');
    if (classParam && /^[1-3]-[1-9][0-9]?$/.test(classParam)) {
      currentClass = classParam;
    } else {
      currentClass = '1-1';
    }
    classSelect.value = currentClass;
    
    classSelect.addEventListener('change', (e) => {
      currentClass = e.target.value;
      const newUrl = `${window.location.origin}${window.location.pathname}?class=${currentClass}`;
      window.history.replaceState({ path: newUrl }, '', newUrl);
      connectFirebase();
    });
    
    // 2D 조감도 그리기 (밝고 선명한 톤으로 전면 개편)
    function drawBaseMap() {
      let mapsHTML = '';
      for (let i = 0; i < 4; i++) {
        mapsHTML += `
          <div class="relative bg-[#fcfbfa] border-2 border-[#e8dbcc] rounded-xl overflow-hidden aspect-square flex flex-col p-2 select-none shadow-md" id="roomMapBox_${i}">
            <!-- 방 라벨 (고가독성) -->
            <div class="absolute top-2.5 left-2.5 z-10 text-xs font-bold text-white bg-[#8c6239] border border-[#5c4033] px-2 py-0.5 rounded shadow">
              ${ROOM_NAMES[i]}
            </div>
            
            <!-- 3D 좌표 보조선 -->
            <div class="absolute inset-0 border border-dashed border-[#f2eae1] pointer-events-none z-0"></div>
            
            <!-- 1) 고체 장애물 벽 (선명한 그레이톤으로 톤업) -->
            <div class="absolute inset-0 pointer-events-none z-0">
        `;
        
        const blocks = ROOM_BLOCKS[i] || [];
        blocks.forEach(b => {
          const left = ((b.x - b.w/2 + 16) / 32) * 100;
          const top = ((b.z - b.d/2 + 16) / 32) * 100;
          const width = (b.w / 32) * 100;
          const height = (b.d / 32) * 100;
          mapsHTML += `
            <div class="absolute bg-[#e2d8ce] border border-[#c8bba6] rounded shadow-sm" style="left: ${left}%; top: ${top}%; width: ${width}%; height: ${height}%"></div>
          `;
        });
        
        mapsHTML += `
            </div>
            
            <!-- 2) 가구들 세부 위치 (흰색 선명한 볼드 텍스트, 10px로 상향) -->
            <div class="absolute inset-0 pointer-events-none z-10">
        `;
        
        const furns = ROOM_FURNITURES[i] || [];
        furns.forEach(f => {
          const left = ((f.x - f.w/2 + 16) / 32) * 100;
          const top = ((f.z - f.d/2 + 16) / 32) * 100;
          const width = (f.w / 32) * 100;
          const height = (f.d / 32) * 100;
          
          let styleClass = "bg-[#8c6239] border border-[#6b4725] text-white rounded font-bold shadow-sm";
          if (f.build === 'jar') {
            styleClass = "bg-[#a67c52] border border-[#7f5c38] rounded-full text-white font-bold shadow-sm";
          } else if (f.build === 'scroll') {
            styleClass = "bg-[#bca693] border border-[#9a826e] text-[#4a301a] font-bold shadow-sm";
          } else if (f.build === 'npc') {
            styleClass = "bg-[#2e7d32] border border-[#1b5e20] text-white rounded-full font-bold shadow-sm";
          } else if (f.build === 'door') {
            styleClass = "bg-[#c62828] border border-[#b71c1c] text-white rounded font-bold shadow-sm";
          }
          
          mapsHTML += `
            <div class="absolute flex flex-col items-center justify-center text-[10px] md:text-[11px] overflow-hidden leading-tight ${styleClass}" style="left: ${left}%; top: ${top}%; width: ${width}%; height: ${height}%">
              <span class="scale-95 transform origin-center text-center truncate max-w-full px-0.5">${f.name}</span>
            </div>
          `;
        });
        
        mapsHTML += `
            </div>
            
            <!-- 3) 학생 칩 컨테이너 -->
            <div class="absolute inset-0 z-20" id="roomMapChips_${i}"></div>
          </div>
        `;
      }
      roomMapsGrid.innerHTML = mapsHTML;
    }
    
    function initFirebase() {
      if (CONFIG.FIREBASE && CONFIG.FIREBASE.databaseURL) {
        try {
          firebase.initializeApp(CONFIG.FIREBASE);
          db = firebase.database();
          drawBaseMap();
          connectFirebase();
        } catch (e) {
          console.error("Firebase 초기화 에러:", e);
          renderError("Firebase 연동 실패. 설정을 확인하세요.");
        }
      } else {
        renderError("Firebase databaseURL이 비어 있습니다. 설정을 채워주세요.");
      }
    }
    
    let fbRef = null;
    function connectFirebase() {
      if (fbRef) {
        fbRef.off();
      }
      
      // 학급 변경 시 화면 상의 모든 이전 학생 칩 잔상 삭제
      document.querySelectorAll('.student-chip').forEach(chip => chip.remove());
      for (const k in prevRooms) delete prevRooms[k];
      
      studentsData = {};
      renderDashboard();
      
      fbRef = db.ref('classes/' + currentClass);
      fbRef.on('value', (snapshot) => {
        studentsData = snapshot.val() || {};
        renderDashboard();
      }, (error) => {
        console.error("Firebase 수신 에러:", error);
        renderError("실시간 데이터 연결 오류가 발생했습니다.");
      });
    }
    
    function renderError(msg) {
      studentList.innerHTML = `<div class="text-red-650 text-sm p-4 text-center border border-red-200 bg-red-50 rounded-lg">${msg}</div>`;
      roomMapsGrid.innerHTML = `<div class="col-span-2 text-stone-500 text-sm text-center p-8 border border-[#e8dbcc] bg-white rounded-xl">데이터를 불러올 수 없습니다.</div>`;
    }
    
    const prevRooms = {};
    
    function renderDashboard() {
      const students = [];
      for (const key in studentsData) {
        if (studentsData[key] && typeof studentsData[key] === 'object') {
          students.push(studentsData[key]);
        }
      }
      students.sort((a, b) => (a.number || 0) - (b.number || 0));
      
      studentCount.textContent = `${students.length}명 참여 중`;
      
      let listHTML = '';
      let winHTML = '';
      let hasWin = false;
      const now = Date.now();
      
      students.forEach(st => {
        const roomIdx = Math.min(3, st.currentRoom !== undefined ? st.currentRoom : 0);
        const isFinished = st.progressRate >= 100;
        
        const lastActive = st.lastUpdated || now;
        const idleTimeMs = now - lastActive;
        const isStagnant = !isFinished && idleTimeMs >= 180000;
        
        // 1) 리스트 뷰 카드 (밝은 웜그레이 톤 고대비 리폼)
        const timeStr = new Date(lastActive).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const minutesAgo = Math.floor(idleTimeMs / 60000);
        const idleWarning = isStagnant ? `<span class="text-xs text-red-600 font-bold animate-pulse">⚠️ ${minutesAgo}분 지체</span>` : '';
        
        let cardClass = "bg-[#fbf9f6] border border-[#dfd5c6] p-3.5 rounded-lg shadow-sm";
        if (isFinished) {
          cardClass = "bg-emerald-50 border border-emerald-300 p-3.5 rounded-lg shadow-sm";
        } else if (isStagnant) {
          cardClass = "bg-red-50 border border-red-300 p-3.5 rounded-lg stagnant-pulse";
        }
        
        listHTML += `
          <div class="${cardClass}">
            <div class="flex justify-between items-start mb-1">
              <div class="flex items-center gap-1.5">
                <span class="text-stone-500 font-mono text-xs font-bold">${st.number}번</span>
                <span class="font-extrabold text-stone-850 text-sm">${st.name}</span>
              </div>
              <span class="text-xs ${isFinished ? 'text-emerald-700 font-extrabold' : 'text-blue-700 font-extrabold'}">${st.progressRate}%</span>
            </div>
            
            <div class="w-full bg-[#eee7de] rounded-full h-1.5 mb-2 overflow-hidden shadow-inner">
              <div class="h-1.5 rounded-full ${isFinished ? 'bg-emerald-600' : 'bg-blue-600'}" style="width: ${st.progressRate}%"></div>
            </div>
            
            <div class="flex justify-between items-center text-xs text-stone-600 font-medium">
              <span class="truncate max-w-[140px]">${isFinished ? '최종 완주성공!' : (st.currentRoomName || ROOM_NAMES[roomIdx])}</span>
              <span class="text-[10px] text-stone-500">${timeStr} ${idleWarning}</span>
            </div>
            <div class="text-[11px] text-amber-800 font-bold mt-0.5 truncate">${st.currentStep || ''}</div>
          </div>
        `;
        
        // 2) 조감도 칩 렌더링
        if (isFinished) {
          hasWin = true;
          winHTML += `
            <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs bg-emerald-100 border border-emerald-400 text-emerald-850 font-bold shadow">
              <span class="font-mono text-[10px] bg-white/60 px-1 rounded border border-emerald-200">${st.number}번</span>
              <span>${st.name}</span>
              <span class="text-[10px] opacity-75 font-normal">(${timeStr})</span>
            </div>
          `;
          
          const oldChip = document.getElementById(`student_chip_${st.number}`);
          if (oldChip) {
            oldChip.remove();
          }
        } else {
          const px = st.x !== undefined ? st.x : 0;
          const pz = st.z !== undefined ? st.z : 7;
          
          const leftPercent = ((px + 16) / 32) * 100;
          const topPercent = ((pz + 16) / 32) * 100;
          
          const prevRoom = prevRooms[st.number];
          const isRoomChanged = prevRoom !== undefined && prevRoom !== roomIdx;
          prevRooms[st.number] = roomIdx;
          
          let chip = document.getElementById(`student_chip_${st.number}`);
          if (!chip) {
            chip = document.createElement('div');
            chip.id = `student_chip_${st.number}`;
            chip.className = `student-chip absolute select-none pointer-events-auto z-30 transform -translate-x-1/2 -translate-y-1/2 flex items-center shadow-lg`;
            document.body.appendChild(chip);
          }
          
          let colorClass = "bg-[#ffd54f] border border-[#5c4033] text-[#2b1f15] font-black";
          if (isStagnant) {
            colorClass = "bg-[#d32f2f] border border-[#ffd54f] text-white font-black stagnant-pulse";
          }
          
          let numberSpan = `<span class="font-mono text-[9px] bg-[#5c4033]/15 text-[#2b1f15] px-1 rounded font-bold">${st.number}</span>`;
          let textSpan = `<span class="text-xs text-[#2b1f15] font-extrabold">${st.name}</span>`;
          if (isStagnant) {
            numberSpan = `<span class="font-mono text-[9px] bg-white/20 text-white px-1 rounded font-bold">${st.number}</span>`;
            textSpan = `<span class="text-xs text-white font-extrabold">${st.name}</span>`;
          }
          
          chip.innerHTML = `
            <div class="px-2.5 py-1 rounded-full text-xs ${colorClass} whitespace-nowrap shadow-md flex items-center gap-1.5 cursor-help" title="${st.name} (${st.number}번) / 학습단계: ${st.currentStep || '진행 중'}">
              ${numberSpan}
              ${textSpan}
            </div>
          `;
          
          if (isRoomChanged) {
            chip.classList.add('no-transition');
          } else {
            chip.classList.remove('no-transition');
          }
          
          chip.style.left = `${leftPercent}%`;
          chip.style.top = `${topPercent}%`;
          
          if (isRoomChanged) {
            void chip.offsetWidth;
            chip.classList.remove('no-transition');
          }
          
          const targetContainer = document.getElementById(`roomMapChips_${roomIdx}`);
          if (targetContainer && chip.parentNode !== targetContainer) {
            targetContainer.appendChild(chip);
          }
        }
      });
      
      studentList.innerHTML = listHTML || `<div class="text-stone-400 text-center py-10 text-sm italic">참여 중인 학생이 없습니다.</div>`;
      winRoomArea.innerHTML = hasWin ? winHTML : `<div class="text-stone-450 text-xs my-auto italic">아직 완주한 학생이 없습니다.</div>`;
      
      const existingChips = document.querySelectorAll('.student-chip');
      existingChips.forEach(chip => {
        const num = parseInt(chip.id.replace('student_chip_', ''), 10);
        if (!students.some(st => st.number === num && st.progressRate < 100)) {
          chip.remove();
          delete prevRooms[num];
        }
      });
    }
    
    setInterval(() => {
      if (studentsData && Object.keys(studentsData).length > 0) {
        renderDashboard();
      }
    }, 10000);
    
    initFirebase();
  </script>
</body>
</html>
