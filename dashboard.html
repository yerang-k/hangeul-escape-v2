    if (localStorage.getItem('hangeul_dashboard_theme_v2') !== 'light') {

    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
    @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap');
    body {
      font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif;
      font-weight: 400; /* 기본은 얇게 — 강조는 필요한 곳(제목·이름·수치)만 */
      background-color: #faf9f7; /* 웜 뉴트럴 베이스 */
      color: #1f1c18;
      font-variant-numeric: tabular-nums;
      transition: background-color .2s, color .2s;
    }
    .dark body {
      background-color: #141210; /* 웜 잉크블랙 */
      color: #ece7df;
    }
    /* 전통 한 끗: 제목·완주명단 제목에만 명조체 */
    .serif { font-family: 'Nanum Myeongjo', 'Pretendard', serif; }
    .myeongjo { font-family: inherit; } /* 나머지는 산세리프 유지(시인성) */
    /* 정체(경보)는 카드 전체를 붉게 칠하지 않고, 작은 점만 조용히 점멸 */
    .stagnant-dot { animation: dotPulse 1.4s infinite alternate; }
    @keyframes dotPulse { 0% { opacity: .35; } 100% { opacity: 1; } }
    .student-chip {
      transition: left 1s cubic-bezier(.4,0,.2,1), top 1s cubic-bezier(.4,0,.2,1);
    }
    .no-transition { transition: none !important; }
    /* 이동 캐릭터 이름표: 검정 외곽선 대신 반투명 알약 */
    .name-pill {
      background: rgba(28,24,18,.62); color: #fff;
      padding: 1px 7px; border-radius: 999px; font-weight: 600;
      -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    }
    @keyframes stagnantGlow {
      0% { filter: drop-shadow(0 0 1px #d9694c); }
      100% { filter: drop-shadow(0 0 6px #d9694c); }
    }
    .char-stagnant { animation: stagnantGlow 0.9s infinite alternate; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>

  <script>

    let db = null;

    let studentsData = {};
    // 대시보드는 반 단위가 아니라 학년(특별실) 단위 3개로 운영
    const VENUES = [{grade:'1',name:'1학년 · 시청각실'},{grade:'2',name:'2학년 · 대회의실'},{grade:'3',name:'3학년 · 수학전용실'}];

    const CHAR_COLORS = ['#e57373', '#64b5f6', '#81c784', '#ba68c8', '#4db6ac', '#f06292', '#a1887f', '#7986cb'];
    // 학생 이름 등은 게임 쪽에서 통제되지 않은 값일 수 있어 innerHTML에 꽂기 전 반드시 이스케이프
    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function safeColor(c) { return /^#[0-9a-fA-F]{3,8}$/.test(c) ? c : null; }
    
    // 3D 맵 실제 장애물 정보 (x, z, w, d)

    const classSelect = document.getElementById('classSelect');
    const roomMapsGrid = document.getElementById('roomMapsGrid');

    const studentList = document.getElementById('studentList');
    const studentCount = document.getElementById('studentCount');
    const toggleListBtn = document.getElementById('toggleListBtn');
    const toggleText = document.getElementById('toggleText');
    const mainGrid = document.getElementById('mainGrid');

    // 대시보드 선택 생성 (학년당 특별실 1개, 총 3개)
    VENUES.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v.grade;
      opt.textContent = v.name;
      classSelect.appendChild(opt);
    });
    
    // 다크모드 토글 (교사가 그때그때 켜고 끔, localStorage에 기억)
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');
    function applyThemeUI() {
      const isDark = document.documentElement.classList.contains('dark');
      themeIcon.textContent = isDark ? '☀️' : '🌙';
      themeText.textContent = isDark ? '라이트모드' : '다크모드';
    }
    applyThemeUI();
    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('hangeul_dashboard_theme_v2', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      applyThemeUI();
    });

    // 리스트 뷰 토글 (기본은 접힌 상태로 시작 — 조감도를 넓게 보기 위함)
    let isCollapsed = true;
    listSection.classList.add('hidden');
    mapSection.classList.replace('lg:col-span-2', 'lg:col-span-3');
    toggleText.textContent = "현황판 펴기";
    toggleListBtn.addEventListener('click', () => {
      isCollapsed = !isCollapsed;
      if (isCollapsed) {
        listSection.classList.add('hidden');
        mapSection.classList.replace('lg:col-span-2', 'lg:col-span-3');
        toggleText.textContent = "현황판 펴기";
      } else {
        listSection.classList.remove('hidden');
        mapSection.classList.replace('lg:col-span-3', 'lg:col-span-2');
        toggleText.textContent = "현황판 접기";
      }
      setTimeout(renderDashboard, 100);
    });

    // 학급 데이터 전체 초기화 버튼 리스너
    const clearDataBtn = document.getElementById('clearDataBtn');
    if (clearDataBtn) {
      clearDataBtn.addEventListener('click', () => {
        const venueName = (VENUES.find(v => v.grade === currentClass) || {}).name || currentClass;
        if (confirm(`${venueName}의 모든 실시간 대시보드 데이터를 초기화하시겠습니까?\n(학생들의 게임 화면은 유지되지만, 대시보드 조감도와 리스트 목록에서는 즉시 싹 사라집니다.)`)) {
          db.ref('classes/' + currentClass).remove();
        }
      });
    }

    // 개별 학생 삭제 전역 함수 (key는 studentsData의 실제 firebase 키, 예: student_1-3_5)
    window.removeStudent = (key) => {
      const st = studentsData[key];
      const label = st ? `${st.classId || ''} ${st.number}번 ${st.name}` : '학생';
      if (confirm(`[${label}] 학생을 대시보드에서 제외하시겠습니까?`)) {
        db.ref('classes/' + currentClass + '/' + key).remove();
      }
    };

    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }
    
    const classParam = getQueryParam('class');
    if (classParam && /^[1-3]$/.test(classParam)) {
      currentClass = classParam;
    } else {
      currentClass = '1';
    }
    classSelect.value = currentClass;
    
    classSelect.addEventListener('change', (e) => {
      currentClass = e.target.value;
      const newUrl = `${window.location.origin}${window.location.pathname}?class=${currentClass}`;
      window.history.replaceState({ path: newUrl }, '', newUrl);
      connectFirebase();
    });
    
    // 2D 조감도 그리기 (밝고 선명한 톤으로 전면 개편)
    function drawBaseMap() {
      let mapsHTML = '';
      for (let i = 0; i < 4; i++) {
        mapsHTML += `
          <div class="flex flex-col items-center gap-1.5">
            <!-- 방 라벨 (박스 밖, 가운데 정렬) -->
            <div class="text-[13px] font-semibold text-[#22201c] dark:text-[#ece7df] text-center flex items-baseline gap-1.5 justify-center">

              <span>${ROOM_NAMES[i].replace(/^제\d방\s*\(([^)]+)\)$/, '$1')}</span>
            </div>
            <div class="relative bg-[#f4f2ee] dark:bg-[#191713] border border-[#e9e6e0] dark:border-[#2c2924] rounded-lg overflow-hidden aspect-square flex flex-col p-2 select-none w-full" id="roomMapBox_${i}">

            <!-- 1) 고체 장애물 벽 (저채도 뉴트럴) -->
            <div class="absolute inset-0 pointer-events-none z-0">
        `;

        const blocks = ROOM_BLOCKS[i] || [];
        blocks.forEach(b => {
          const left = ((b.x - b.w/2 + 16) / 32) * 100;
          const top = ((b.z - b.d/2 + 16) / 32) * 100;
          const width = (b.w / 32) * 100;
          const height = (b.d / 32) * 100;
          mapsHTML += `
            <div class="absolute bg-[#e7e3db] dark:bg-[#26231e] rounded-md" style="left: ${left}%; top: ${top}%; width: ${width}%; height: ${height}%"></div>
          `;
        });
        
        mapsHTML += `
            </div>
            
            <!-- 2) 가구들 세부 위치 (흰색 선명한 볼드 텍스트, 10px로 상향) -->
            <div class="absolute inset-0 pointer-events-none z-10">
        `;
        
        const furns = ROOM_FURNITURES[i] || [];
        furns.forEach(f => {
          const left = ((f.x - f.w/2 + 16) / 32) * 100;
          const top = ((f.z - f.d/2 + 16) / 32) * 100;
          const width = (f.w / 32) * 100;
          const height = (f.d / 32) * 100;
          
          let styleClass = "bg-[#e3ddd2] dark:bg-[#2a2620] rounded-md";   // 서안·궤 등
          if (f.build === 'jar') {
            styleClass = "bg-[#e3ddd2] dark:bg-[#2a2620] rounded-full";
          } else if (f.build === 'scroll') {
            styleClass = "bg-[#e7e3db] dark:bg-[#26231e] rounded-sm";
          } else if (f.build === 'npc') {
            styleClass = "bg-[#dbe7e0] dark:bg-[#20302a] rounded-full";   // 저채도 청록 — NPC 식별
          } else if (f.build === 'door') {
            styleClass = "bg-[#eed8d2] dark:bg-[#33231f] rounded-md";     // 저채도 벽돌빛 — 출구 식별
          }

          mapsHTML += `
            <div class="absolute ${styleClass}" style="left: ${left}%; top: ${top}%; width: ${width}%; height: ${height}%">
              <!-- 라벨: 검정 외곽선 대신 옅은 알약 배경으로 깔끔하게 -->
              <span class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-[9px] md:text-[10px] font-medium leading-none whitespace-nowrap text-[#6b655c] dark:text-[#a49c8d] px-1 py-0.5 rounded bg-[#faf9f7]/85 dark:bg-[#141210]/70">${f.name}</span>
            </div>
          `;
        });
        
        mapsHTML += `
            </div>
            
            <!-- 3) 학생 칩 컨테이너 -->
            <div class="absolute inset-0 z-20" id="roomMapChips_${i}"></div>
            </div>
          </div>
        `;
      }
      roomMapsGrid.innerHTML = mapsHTML;
    }
    
    function initFirebase() {
      if (CONFIG.FIREBASE && CONFIG.FIREBASE.databaseURL) {
        try {
          firebase.initializeApp(CONFIG.FIREBASE);
          db = firebase.database();
          drawBaseMap();
          connectFirebase();
        } catch (e) {
          console.error("Firebase 초기화 에러:", e);
          renderError("Firebase 연동 실패. 설정을 확인하세요.");
        }
      } else {
        renderError("Firebase databaseURL이 비어 있습니다. 설정을 채워주세요.");
      }
    }
    
    let fbRef = null;
    function connectFirebase() {
      if (fbRef) {
        fbRef.off();
      }
      
      // 학급 변경 시 화면 상의 모든 이전 학생 칩 잔상 삭제
      document.querySelectorAll('.student-chip').forEach(chip => chip.remove());
      for (const k in prevRooms) delete prevRooms[k];
      
      studentsData = {};
      renderDashboard();
      
      // 학생 한 명이 바뀔 때마다 학급 전체를 통째로 다시 받지 않도록, 바뀐 학생 한 명씩만 구독
      // (인원이 많아질수록 예전 방식은 매번 전체 목록을 다시 그려서 버벅였음)
      const onFbError = (error) => {
        console.error("Firebase 수신 에러:", error);
        renderError("실시간 데이터 연결 오류가 발생했습니다.");
      };
      fbRef = db.ref('classes/' + currentClass);
      fbRef.on('child_added', (snap) => { studentsData[snap.key] = snap.val(); scheduleRender(); }, onFbError);
      fbRef.on('child_changed', (snap) => { studentsData[snap.key] = snap.val(); scheduleRender(); }, onFbError);
      fbRef.on('child_removed', (snap) => { delete studentsData[snap.key]; scheduleRender(); }, onFbError);
    }

    // 여러 학생이 같은 순간에 위치를 보내도 화면은 프레임당 한 번만 다시 그림
    let renderScheduled = false;
    function scheduleRender() {
      if (renderScheduled) return;
      renderScheduled = true;
      requestAnimationFrame(() => { renderScheduled = false; renderDashboard(); });
    }
    
    function renderError(msg) {
      studentList.innerHTML = `<div class="text-[#d9694c] text-sm p-4 text-center border border-[#e9d3cb] dark:border-[#4a2f28] bg-[#fbeee9] dark:bg-[#2a1a15] rounded-lg">${msg}</div>`;
      roomMapsGrid.innerHTML = `<div class="col-span-2 text-[#8f8a80] text-sm text-center p-8 border border-[#e9e6e0] dark:border-[#2c2924] bg-white dark:bg-[#1c1a17] rounded-xl">데이터를 불러올 수 없습니다.</div>`;
    }
    
    // 게임 3D 한복 캐릭터(buildAvatar)를 2D 미니맵용으로 단순화: 저고리(크림)+치마(학생 선택색)+고름/버선(고동)
    function hanbokSVG(skirtColor, isStagnant) {
      return `
        <svg class="${isStagnant ? 'char-stagnant' : ''}" width="22" height="30" viewBox="0 0 20 28" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="8" width="3" height="6" rx="1" fill="#f3ece0"/>
          <rect x="16" y="8" width="3" height="6" rx="1" fill="#f3ece0"/>
          <path d="M4,14.4 L16,14.4 L18,26 L2,26 Z" fill="${skirtColor}"/>
          <rect x="2" y="24" width="16" height="2" fill="#8a2f2e"/>
          <rect x="5" y="6" width="10" height="7" fill="#f3ece0"/>
          <rect x="4" y="12" width="12" height="2.4" fill="${skirtColor}"/>
          <rect x="8.6" y="8.3" width="1.4" height="3.4" fill="#8a2f2e"/>
          <ellipse cx="10" cy="4" rx="4" ry="4" fill="#f4c48c"/>
          <path d="M6,2 A4,4 0 0,1 14,2 Z" fill="#241a12"/>
          <rect x="5" y="2.5" width="1.6" height="5" fill="#241a12"/>
          <rect x="13.4" y="2.5" width="1.6" height="5" fill="#241a12"/>
        </svg>
      `;
    }

    const prevRooms = {};

    // 완주 랭킹: 소요시간(durationMs)이 빠른 순. 시간 정보가 없는 옛 데이터는 뒤로 보내고 완주 시각 순
    function fmtDur(ms) {
      const s = Math.round(ms / 1000);
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }
    const MEDALS = [
      'from-[#f3d98a] to-[#c99a2e]',   // 금
      'from-[#e4e6ea] to-[#a9adb4]',   // 은
      'from-[#e3b48a] to-[#a86b3c]'    // 동
    ];
    function renderRanking(finishers) {
      const has = f => typeof f.st.durationMs === 'number';
      finishers.sort((a, b) => (has(b) - has(a)) || (has(a) ? a.st.durationMs - b.st.durationMs : a.lastActive - b.lastActive));
      let html = '';
      finishers.forEach((f, i) => {
        const rank = i + 1, st = f.st, top = rank <= 10;
        const rowCls = rank === 1
          ? 'bg-[#f8ecc6] dark:bg-[#33290f] border-[#e6cd82] dark:border-[#6b5518]'
          : top
            ? 'bg-[#faf3df] dark:bg-[#2a2314] border-[#eddfb5] dark:border-[#4a3d20]'
            : 'bg-white dark:bg-[#1c1a17] border-[#e9e6e0] dark:border-[#2c2924]';
        const badge = rank <= 3
          ? `<span class="w-7 h-7 flex-none rounded-full bg-gradient-to-br ${MEDALS[rank - 1]} text-[#2a2110] text-[13px] font-bold flex items-center justify-center shadow-sm">${rank}</span>`
          : top
            ? `<span class="w-7 h-7 flex-none rounded-full border border-[#c99a2e] dark:border-[#8a6d22] text-[#9a7420] dark:text-[#e0b357] text-[12px] font-bold flex items-center justify-center">${rank}</span>`
            : `<span class="w-7 flex-none text-center text-[12px] text-[#8f8a80]">${rank}</span>`;
        const time = has(f)
          ? `<span class="text-[15px] font-bold ${top ? 'text-[#9a7420] dark:text-[#e0b357]' : 'text-[#5c574e] dark:text-[#b7b1a6]'}">${fmtDur(st.durationMs)}</span>`
          : `<span class="text-[11px] text-[#8f8a80]" title="소요시간 정보 없음(완주 시각)">${f.timeStr}</span>`;
        html += `
          <div class="flex items-center gap-3 px-3 py-2 rounded-lg border ${rowCls}">
            ${badge}
            <span class="font-semibold text-[14px] text-[#22201c] dark:text-[#ece7df] truncate">${esc(st.name)}</span>
            <span class="font-mono text-[11px] text-[#8f8a80] flex-none">${esc(st.classId || '')} ${st.number}번</span>
            <span class="ml-auto flex-none">${time}</span>
          </div>`;
        // 상위 10명 경계선(선물 기준선)
        if (rank === 10 && finishers.length > 10) {
          html += `<div class="flex items-center gap-2 py-1 text-[11px] text-[#9a7420] dark:text-[#e0b357]"><span class="flex-1 h-px bg-[#e6cd82] dark:bg-[#4a3d20]"></span>여기까지 상위 10명<span class="flex-1 h-px bg-[#e6cd82] dark:bg-[#4a3d20]"></span></div>`;
        }
      });
      return html;
    }

    function renderDashboard() {
      const students = [];
      for (const key in studentsData) {
        if (studentsData[key] && typeof studentsData[key] === 'object') {
          students.push(Object.assign({_key: key}, studentsData[key]));
        }
      }
      // 여러 반이 한 대시보드에 섞이므로 반 → 번호 순으로 정렬
      students.sort((a, b) => (a.classId || '').localeCompare(b.classId || '') || (a.number || 0) - (b.number || 0));
      
      studentCount.textContent = `${students.length}명 참여 중`;
      
      let listHTML = '';
      const finishers = [];
      const now = Date.now();
      
      students.forEach(st => {
        const roomIdx = Math.min(3, st.currentRoom !== undefined ? st.currentRoom : 0);
        const isFinished = st.progressRate >= 100;
        
        const lastActive = st.lastUpdated || now;
        const idleTimeMs = now - lastActive;
        const isStagnant = !isFinished && idleTimeMs >= 180000;
        
        // 1) 리스트 뷰 카드 (밝은 웜그레이 톤 고대비 리폼)
        const timeStr = new Date(lastActive).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const minutesAgo = Math.floor(idleTimeMs / 60000);
        const idleWarning = isStagnant ? `<span class="text-[12px] text-[#d9694c] font-semibold">${minutesAgo}분 지체</span>` : '';

        // 카드: 흰 바탕 + 1px 테두리 + 좌측 4px 상태 스트라이프(진행/정체/완주)
        const stripe = isFinished ? 'border-l-[#3f9e7c] dark:border-l-[#5fbf98]' : (isStagnant ? 'border-l-[#d9694c] dark:border-l-[#f0836a]' : 'border-l-[#4f6bed] dark:border-l-[#8098f5]');
        const pctColor = isFinished ? 'text-[#3f9e7c] dark:text-[#5fbf98]' : (isStagnant ? 'text-[#d9694c] dark:text-[#f0836a]' : 'text-[#4f6bed] dark:text-[#8098f5]');
        const barColor = isFinished ? 'bg-[#3f9e7c]' : (isStagnant ? 'bg-[#d9694c]' : 'bg-[#4f6bed]');

        listHTML += `
          <div class="bg-white dark:bg-[#1c1a17] border border-[#e9e6e0] dark:border-[#2c2924] border-l-4 ${stripe} p-3 rounded-lg">
            <div class="flex justify-between items-center gap-2">
              <div class="flex items-baseline gap-2 min-w-0">
                <span class="text-[#8f8a80] font-mono text-[12px]">${esc(st.classId || '')} ${st.number}번</span>
                <span class="font-semibold text-[#22201c] dark:text-[#ece7df] text-[14px] truncate">${esc(st.name)}</span>
              </div>
              <div class="flex items-center gap-2 flex-none">
                <span class="text-[14px] font-bold ${pctColor}">${st.progressRate}%</span>
                <button onclick="removeStudent('${st._key}')" class="text-[#c4bfb5] dark:text-[#6f6a5f] hover:text-[#d9694c] text-[13px] cursor-pointer transition-colors leading-none" title="이 학생 삭제">✕</button>
              </div>
            </div>

            <div class="w-full bg-[#f0eee9] dark:bg-white/10 rounded-full h-[5px] my-2 overflow-hidden">
              <div class="h-full rounded-full ${barColor}" style="width: ${st.progressRate}%"></div>
            </div>

            <div class="flex justify-between items-center gap-2 text-[12px]">
              <span class="text-[#5c574e] dark:text-[#b7b1a6] truncate max-w-[150px]">${isFinished ? '최종 탈출 성공!' : esc(st.currentRoomName || ROOM_NAMES[roomIdx])}</span>
              <span class="flex items-center gap-1.5 flex-none"><span class="text-[#8f8a80]">${timeStr}</span>${idleWarning}${isStagnant ? '<span class="inline-block w-[6px] h-[6px] rounded-full bg-[#d9694c] stagnant-dot"></span>' : ''}</span>
            </div>
            ${st.currentStep ? `<div class="text-[12px] text-[#8a4a3d] dark:text-[#d99a86] mt-1 truncate">${esc(st.currentStep)}</div>` : ''}
          </div>
        `;
        
        // 2) 조감도 칩 렌더링
        if (isFinished) {
          finishers.push({ st, timeStr, lastActive });

          const oldChip = document.getElementById(`student_chip_${st._key}`);
          if (oldChip) {
            oldChip.remove();
          }
        } else {
          const px = st.x !== undefined ? st.x : 0;
          const pz = st.z !== undefined ? st.z : 7;

          const leftPercent = ((px + 16) / 32) * 100;
          const topPercent = ((pz + 16) / 32) * 100;

          const prevRoom = prevRooms[st._key];
          const isRoomChanged = prevRoom !== undefined && prevRoom !== roomIdx;
          prevRooms[st._key] = roomIdx;

          let chip = document.getElementById(`student_chip_${st._key}`);
          if (!chip) {
            chip = document.createElement('div');
            chip.id = `student_chip_${st._key}`;
            chip.className = `student-chip absolute select-none pointer-events-auto z-30 transform -translate-x-1/2 -translate-y-1/2`;
            document.body.appendChild(chip);
          }

          // 게임 속 한복 캐릭터를 그대로 미니맵에 재현: 학생이 고른 치마 색 반영, 이름은 머리 위에 떠서 이동.
          const skirtColor = safeColor(st.color) || CHAR_COLORS[(st.number + (st.classId || '').length) % CHAR_COLORS.length];
          const safeTitle = esc(`${st.classId || ''} ${st.name} (${st.number}번) / 학습단계: ${st.currentStep || '진행 중'}`);

          chip.innerHTML = `
            <div class="flex flex-col items-center cursor-help" title="${safeTitle}">
              <div class="name-pill text-[10px] leading-none whitespace-nowrap mb-1">${esc(st.name)}</div>
              ${hanbokSVG(skirtColor, isStagnant)}
            </div>
          `;
          
          if (isRoomChanged) {
            chip.classList.add('no-transition');
          } else {
            chip.classList.remove('no-transition');
          }
          
          chip.style.left = `${leftPercent}%`;
          chip.style.top = `${topPercent}%`;
          
          if (isRoomChanged) {
            void chip.offsetWidth;
            chip.classList.remove('no-transition');
          }
          
          const targetContainer = document.getElementById(`roomMapChips_${roomIdx}`);
          if (targetContainer && chip.parentNode !== targetContainer) {
            targetContainer.appendChild(chip);
          }
        }
      });
      
      studentList.innerHTML = listHTML || `<div class="text-stone-400 text-center py-10 text-sm italic">참여 중인 학생이 없습니다.</div>`;
      winRoomArea.innerHTML = finishers.length ? renderRanking(finishers) : `<div class="text-[#8f8a80] text-sm my-auto">아직 완주한 학생이 없습니다.</div>`;
      
      const existingChips = document.querySelectorAll('.student-chip');
      existingChips.forEach(chip => {
        const key = chip.id.replace('student_chip_', '');
        if (!students.some(st => st._key === key && st.progressRate < 100)) {
          chip.remove();
          delete prevRooms[key];
        }
      });
    }
    
    setInterval(() => {
      if (studentsData && Object.keys(studentsData).length > 0) {
        renderDashboard();
      }
    }, 10000);
    
    initFirebase();
  </script>
  <div style="text-align:center;font-size:11px;color:#94a3b8;padding:16px 8px 10px;line-height:1.6;word-break:keep-all;">

    복제·배포·수정은 금지합니다.
  </div>
</body>
