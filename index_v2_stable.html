<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>한글날 방탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{--gold:#e0b357;--ink:#f3e6cf;--ink-dim:#b09a74;--ok:#68c06f;--no:#e06a52;--gold-dim:#8a6b2e;
    --font-calligraphy:'East Sea Dokdo',cursive;   /* 서예/붓글씨 (타이틀·단서) */
    --font-traditional:'Gowun Batang',serif;       /* 고서/훈민정음 본문 */
    --font-serif:'Nanum Myeongjo',serif;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0805;
    font-family:'Noto Serif KR','Nanum Myeongjo',serif;color:var(--ink);user-select:none;touch-action:none}
  canvas{display:block}
  #hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:8px 12px;background:linear-gradient(#000000bb,#0000);pointer-events:none}
  #hud .title{color:var(--gold);font-size:.8rem;letter-spacing:.1em}
  #hud .title b{color:var(--ink);font-size:.95rem}
  #safe{display:flex;gap:6px}
  .slot{position:relative;width:28px;height:36px;border:1.5px solid var(--gold-dim);border-radius:6px;
    display:grid;place-items:center;font-size:1.2rem;font-weight:800;color:var(--gold);background:#0007}
  .slot small{position:absolute;bottom:-13px;font-size:.5rem;color:var(--ink-dim)}
  #items{font-size:1.3rem;min-width:30px;text-align:right}
  #stick{position:fixed;right:22px;bottom:26px;width:130px;height:130px;z-index:20;border-radius:50%;
    background:#ffffff14;border:2px solid #ffffff33;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
    background:var(--gold);box-shadow:0 4px 12px #0008;opacity:.9}
  #act{position:fixed;left:22px;bottom:44px;z-index:20;padding:18px 24px;border:none;border-radius:18px;
    background:var(--gold);color:#1a120b;font-family:inherit;font-weight:800;font-size:1.05rem;box-shadow:0 6px 18px #000a;display:none}
  #hintbar{position:fixed;left:0;right:0;bottom:4px;z-index:15;text-align:center;color:#ffffff88;font-size:.76rem;pointer-events:none}

  #overlay{position:fixed;inset:0;z-index:60;background:linear-gradient(#0000 40%,#0008);display:none;align-items:flex-end;justify-content:center;padding:0}
  .modal{background:#241a10;border:1px solid var(--gold-dim);border-bottom:none;border-radius:18px 18px 0 0;max-width:620px;width:calc(100% - 20px);margin:0 auto;padding:14px 18px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px #000b;max-height:66vh;overflow-y:auto;animation:slideup .26s ease-out}
  .modal::before{content:"";display:block;width:40px;height:4px;border-radius:3px;background:#ffffff33;margin:0 auto 10px}
  @keyframes slideup{from{transform:translateY(100%)}}
  .modal .k{color:var(--gold);font-size:.8rem;letter-spacing:.12em}
  .modal .q{font-size:1.08rem;margin:.5em 0 1em;white-space:pre-line;line-height:1.55}
  .opts{display:grid;gap:9px}
  button.opt{text-align:left;font:inherit;color:var(--ink);background:#1d150c;border:1px solid #4a381f;border-radius:11px;padding:13px 15px;cursor:pointer}
  button.opt:hover{border-color:var(--gold)}
  button.opt.wrong{border-color:var(--no);animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .textrow{display:flex;gap:8px;margin-top:6px;width:100%}
  input[type=text]{flex:1;font-size:16px;color:var(--ink);background:#1d150c;border:1px solid #4a381f;border-radius:11px;padding:11px 13px;font-family:inherit}
  input[type=text]:focus{outline:none;border-color:var(--gold)}
  .btn{font:inherit;background:var(--gold);color:#1a120b;border:none;border-radius:11px;padding:11px 16px;font-weight:700;cursor:pointer}
  .btn.ghost{background:#0000;color:var(--ink-dim);border:1px solid #4a381f}
  .msg{min-height:1.3em;margin-top:10px;font-size:.92rem}
  .msg.no{color:var(--no)} .msg.ok{color:var(--ok)}
  .hintline{color:var(--ink-dim);font-size:.86rem;font-style:italic;display:none}
  .row-btns{display:flex;justify-content:space-between;margin-top:14px;align-items:center;gap:10px}
  .hlink{color:var(--ink-dim);background:none;border:none;text-decoration:underline;cursor:pointer;font:inherit;font-size:.82rem}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}
  .keypad button{font:inherit;font-size:1.3rem;padding:14px;border-radius:11px;background:#1d150c;color:var(--ink);border:1px solid #4a381f}
  .keypad button:active{background:var(--gold);color:#1a120b}
  .kdisp{font-size:2rem;letter-spacing:.5em;text-align:center;color:var(--gold);min-height:1.4em;margin:6px 0}

  .chat .who{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:.85rem;margin-bottom:10px}
  .chat .face{width:40px;height:40px;border-radius:50%;background:#1d150c;display:grid;place-items:center;font-size:1.5rem;border:1px solid var(--gold-dim)}
  .bubbles{display:flex;flex-direction:column;gap:8px;max-height:30vh;overflow-y:auto;padding-right:4px}
  .bub{max-width:86%;padding:10px 13px;border-radius:15px;line-height:1.5;font-size:1.02rem;white-space:pre-line;animation:pop .2s}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}}
  .bub.npc{align-self:flex-start;background:#33261a;border-top-left-radius:4px}
  .bub.me{align-self:flex-end;background:#3c5a3c;color:#eafbea;border-top-right-radius:4px}
  .bub.no{align-self:flex-start;background:#4a2a24;color:#f3d5cd;border-top-left-radius:4px}
  .replies{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .reply{text-align:left;font:inherit;color:var(--ink);background:#1d150c;border:1px solid #4a381f;border-radius:14px;padding:12px 14px;cursor:pointer}
  .reply:hover{border-color:var(--gold)}
  .vn{display:flex;flex-direction:column;gap:8px}
  .cast{display:flex;justify-content:space-between;align-items:flex-end;padding:2px 8px 0}
  .por{display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.4;filter:grayscale(.6);transition:.28s}
  .por.on{opacity:1;filter:none;transform:translateY(-3px)}
  .por .ava{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:1.9rem;background:#1d150c;border:2px solid var(--gold-dim)}
  .por.on .ava{border-color:var(--gold);box-shadow:0 0 16px #e0b35766}
  .por span{font-size:.72rem;color:var(--ink-dim);max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .por.on span{color:var(--gold)}
  .tag2{text-align:center;color:var(--gold);font-size:.76rem;letter-spacing:.1em;opacity:.85}
  .bub{position:relative}
  .bub.npc::after,.bub.no::after{content:"◂";position:absolute;left:-9px;top:12px;color:#33261a;font-size:1.1rem}
  .bub.me::after{content:"▸";position:absolute;right:-9px;top:12px;color:#3c5a3c;font-size:1.1rem}
  #fade{position:fixed;inset:0;z-index:65;background:#0d0805;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;opacity:0;pointer-events:none;transition:opacity .6s;text-align:center;padding:24px}
  #fade.on{opacity:1;pointer-events:all}
  #fade .rn{color:var(--gold);font-size:1.6rem} #fade .rc{color:var(--ink-dim)}

  #win{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(#3a2a17,#0d0805)}
  #win .card{background:#241a10;border:1px solid var(--gold);border-radius:18px;padding:26px 22px;max-width:440px;text-align:center;box-shadow:0 0 50px #e0b35744}
  #win .big{font-size:2rem;color:var(--gold);margin:.2em 0}
  .code{font-size:1.5rem;letter-spacing:.1em;color:#1a120b;background:var(--gold);display:inline-block;padding:10px 20px;border-radius:12px;font-weight:800;margin:10px 0}
  a.btn{text-decoration:none;display:inline-block}
  .fine{color:var(--ink-dim);font-size:.8rem;margin-top:12px}

  .screen{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(#2a1c10,#0d0805);text-align:center}
  .screen .card{max-width:420px;width:100%}
  .screen h1{color:var(--gold);font-size:1.7rem;margin:.2em 0}
  .screen p{color:var(--ink-dim);line-height:1.7}
  .swatches{display:flex;gap:10px;justify-content:center;margin:14px 0}
  .sw{width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid #0000}
  .sw.on{border-color:var(--ink)}
  .fld{display:block;width:100%;margin:8px 0;font:inherit;font-size:1.05rem;color:var(--ink);background:#1d150c;border:1px solid #4a381f;border-radius:11px;padding:11px 13px;text-align:center}
  #loading{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--ink-dim);background:radial-gradient(#2a1c10,#0d0805)}
  .spin{width:40px;height:40px;border:4px solid #ffffff22;border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* ── 대문(인트로) 꾸미기 ── */
  .intro-card{background:linear-gradient(#2b1f12,#1c130a);border:2px solid var(--gold-dim);border-radius:22px;
    padding:20px 22px 26px;box-shadow:0 22px 60px #000b, inset 0 0 46px #0007;position:relative;overflow:hidden}
  .intro-card::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,#ffffff06 0 1px,#0000 1px 24px)}
  .intro-badge{position:relative;display:inline-block;color:#1a120b;background:var(--gold);font-weight:800;
    font-size:.8rem;padding:5px 14px;border-radius:20px;letter-spacing:.02em;box-shadow:0 3px 10px #0006}
  .sejong{position:relative;margin:8px auto 0;width:170px;filter:drop-shadow(0 8px 12px #0008)}
  .sejong svg{display:block;margin:0 auto;width:170px;height:auto}
  .sejong-cap{position:relative;color:var(--gold);font-size:.82rem;letter-spacing:.35em;margin:2px 0 2px 6px;opacity:.9}
  #intro .btn{background:linear-gradient(#e9c15f,#cf9a34);box-shadow:0 6px 16px #0007}

  /* ───── 한글 서체 적용(꾸미기) ───── */
  .screen h1{font-family:var(--font-calligraphy);font-size:2.9rem;letter-spacing:.03em}
  #win .big{font-family:var(--font-calligraphy);font-size:2.7rem}
  #fade .rn{font-family:var(--font-calligraphy);font-size:2.4rem}
  .modal .k{font-family:var(--font-calligraphy);font-size:1.25rem;letter-spacing:.03em;color:var(--gold)}
  .modal .q{font-family:var(--font-traditional);font-weight:700;color:var(--ink);text-shadow:0 1px 2px #0006}
  .modal .qguide{font-family:var(--font-serif);font-size:.82rem;color:var(--ink-dim);background:#00000033;
    border-left:2px solid var(--gold-dim);padding:7px 10px;border-radius:0 8px 8px 0;margin:2px 0 10px;line-height:1.5}
  .modal .qguide b{color:var(--gold);font-weight:700}
  .modal .how{font-size:.76rem;color:var(--ink-dim);margin:9px 0 5px}
  #hud .title b{font-family:var(--font-traditional)}
  #intro p b{font-family:var(--font-traditional)}

  /* ───── 황동 자물쇠(퍼즐 모달) ───── */
  .lock-wrap{display:flex;justify-content:center;margin:2px 0 12px}
  .lock-container{position:relative;width:84px;height:112px;transition:transform .3s ease}
  .lock-shackle{position:absolute;top:0;left:16px;width:52px;height:46px;border:9px solid #c79a3a;
    border-bottom:none;border-radius:26px 26px 0 0;box-sizing:border-box;transform-origin:14px 42px;
    transition:transform .6s cubic-bezier(.175,.885,.32,1.275);z-index:1}
  .lock-body{position:absolute;bottom:0;width:84px;height:70px;
    background:linear-gradient(145deg,#e7c063,#a9791a);border-radius:9px;
    box-shadow:0 8px 16px rgba(0,0,0,.45),inset 0 2px 5px rgba(255,255,255,.4);
    z-index:2;display:flex;justify-content:center;align-items:center}
  .keyhole{width:14px;height:14px;border-radius:50%;background:#2b1d0c;position:relative}
  .keyhole::after{content:"";position:absolute;top:9px;left:5px;width:4px;height:13px;background:#2b1d0c}
  .lock-container.unlocked .lock-shackle{transform:translateY(-14px) rotate(-32deg)}
  .lock-container.unlocked{animation:unlock-shake .45s ease-in-out}
  @keyframes unlock-shake{0%{transform:scale(1)}50%{transform:scale(1.08) translateY(-4px)}100%{transform:scale(1)}}
  .lock-container.wrong{animation:wrong-shake .3s ease-in-out}
  @keyframes wrong-shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
  
  /* 모달/대화 중 조이스틱 완전 은닉 */
  body.modal-open #stick {
    display: none !important;
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }
</style>
</head>

  <div class="title" id="roomlabel"></div>

  <div id="items"></div>
</div>

<div class="screen" id="setup"><div class="card">

</div></div>

<!-- 인트로 -->
<div class="screen" id="intro" style="display:none"><div class="card intro-card">
  <div class="intro-badge">🎉 한글날 특별 방탈출 🎉</div>
  <div class="sejong" aria-label="세종대왕 그림">

  <div class="sejong-cap">세 종 대 왕</div>
  <h1>한글날 방탈출</h1>
  <p>네 개의 방이 너를 가둔다.<br><b>창제 · 규범 · 보물 · 한글날의 방</b><br>
  각 방의 단서로 금고를 열어야 다음으로 나아간다.<br>국어의 지혜가 곧 열쇠다.</p>
  <button class="btn" id="startBtn" style="margin-top:12px;font-size:1.1rem;padding:13px 26px">첫 번째 방으로</button>
</div></div>

  onerror="var l=document.getElementById('loading');l.style.display='flex';l.innerHTML='<div style=&quot;max-width:340px&quot;>3D 라이브러리를 불러오지 못했습니다.<br>인터넷에 연결한 뒤 새로고침하세요.</div>'"></script>

<script>
/* ===================== 선생님 설정 ===================== */
const CONFIG = {
  // 1. 스프레드시트 직접 연동 (GAS 웹앱 사용 시)
  SHEET_URL: "https://script.google.com/macros/s/AKfycbxznDbsvKDouhbr9VdRyxM2EKpR5mbta0YjSXUa8j-rXFoNnyICDszqsCRz4SYbrF0r/exec",
  
  // 2. 구글폼 연동 (스프레드시트 부하 방지용 권장)
  FORM_URL: "https://docs.google.com/forms/d/e/1FAIpQLSe3NyI948jN3xvvGjbGBq4hYqaHqIqJICr2d1HQfXJgVkJnQQ/viewform",
  FORM_ENTRIES: {
    id: "entry.1272965112",
    name: "entry.399696500",
    code: "entry.1201075032",
    duration: "entry.93173145"
  },

  // 3. 멀티플레이 설정
  FIREBASE: { apiKey:"", authDomain:"", databaseURL:"", projectId:"" }
};

function seededRand(seedStr){
  let h=1779033703^seedStr.length;
  for(let i=0;i<seedStr.length;i++){h=Math.imul(h^seedStr.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  let a=(h^h>>>16)>>>0;
  return function(){ a|=0;a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
}
let __personalized=false;
function personalize(){
  if(__personalized)return; __personalized=true;
  const rng=seededRand(S.seed||((player.name||'탐험가')+'|hangeul-v1'));
  ROOMS.forEach(R=>{
    const digits=[];
    R.stations.forEach(st=>{
      const alts=ALTS[st.id];
      if(alts&&alts.length){                                   // 문제 은행에서 하나 선택
        if(!st._orig) st._orig={k:st.k,q:st.q,type:st.type,opts:st.opts,answer:st.answer,accept:st.accept,hint:st.hint};
        const v=[st._orig,...alts][Math.floor(rng()*(alts.length+1))];
        st.k=v.k;st.q=v.q;st.type=v.type;st.opts=v.opts;st.answer=v.answer;st.accept=v.accept;st.hint=v.hint;
      }
      if(st.reward&&st.reward.slot!==undefined){                // 금고 숫자를 학생마다 무작위 배정
        const d=String(Math.floor(rng()*10)); st.reward.val=d; digits[st.reward.slot]=d;
      }
    });
    if(digits.length===4) R.code=digits.join('');
  });
}

  const g=['ㄱ','ㄴ','ㄷ','ㅁ','ㅅ','ㅇ','ㅈ','ㅎ','ㅏ','ㅗ','ㅜ','ㅣ','ㅂ','ㅌ','ㅍ','ㄹ'];

  let k=0;for(let r=0;r<4;r++)for(let c=0;c<4;c++)cx.fillText(g[(k++)%g.length],c*s/4+s/8,r*s/4+s/8);
},256);}

(function joystick(){const base=$('#stick'),knob=$('#knob');let id=null,cx,cy;const Rr=48;

    knob.style.transform=`translate(${dx}px,${dy}px)`;               // 노브는 손가락 따라 그대로
    const DEAD=0.16; let m=Math.max(0,(l/Rr-DEAD)/(1-DEAD)); m=m*m; // 데드존 + 제곱 곡선(둔감화)
    const a=Math.atan2(dy,dx); input.x=Math.cos(a)*m; input.y=Math.sin(a)*m;};
  const reset=()=>{knob.style.transform='';input.x=input.y=0;id=null;};
  base.addEventListener('pointerdown',e=>{id=e.pointerId;const r=base.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;set(e.clientX-cx,e.clientY-cy);base.setPointerCapture(id);});

function netUpdate(dt){

    if(d.r!==progress.room){ if(net.avatars[pid]){scene.remove(net.avatars[pid]);delete net.avatars[pid];} continue; }

/* 카메라(어깨 너머 시점 — 캐릭터가 바라보는 방향을 따라감) */
let camYaw=Math.PI; const camTmp=new THREE.Vector3();
camera.position.set(hero.position.x,4.4,hero.position.z+6.5);

const clock=new THREE.Clock(); let phase=0; const SPEED=5.5;
let starTime=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  starTime+=dt;
  if(typeof CUR==='function'&&CUR()){
    CUR().stations.forEach(st=>{
      if(st.star&&st.star.visible){
        st.star.rotation.y+=dt*1.5;
        const pulse=Math.sin(starTime*4)*0.12+0.88;
        st.star.scale.set(pulse,pulse,pulse);
        if(st.star.material)st.star.material.emissiveIntensity=0.5+Math.sin(starTime*6)*0.3;
      }
      if(st.lockIcon&&st.lockIcon.visible){
        st.lockIcon.rotation.y+=dt*1.2;
        const pulse=Math.sin(starTime*3.5)*0.08+0.92;
        st.lockIcon.scale.set(pulse*1.4,pulse*1.4,1);
      }
    });
  }
  let ix=Math.max(-1,Math.min(1,input.x+((keys['d']||keys['arrowright'])?1:0)-((keys['a']||keys['arrowleft'])?1:0)));
  let iy=Math.max(-1,Math.min(1,input.y+((keys['s']||keys['arrowdown'])?1:0)-((keys['w']||keys['arrowup'])?1:0)));
  let moving=false;
  if(!S.paused && !acting && (Math.abs(ix)>0.12||Math.abs(iy)>0.12)){
    // 카메라 기준 이동: '위'는 항상 화면 안쪽(카메라가 보는 방향)=앞으로 고정
    const f=new THREE.Vector3(Math.sin(camYaw),0,Math.cos(camYaw));   // 화면 전방
    const r=new THREE.Vector3(-Math.cos(camYaw),0,Math.sin(camYaw));  // 화면 오른쪽
    const dir=new THREE.Vector3().addScaledVector(f,-iy).addScaledVector(r,ix);
    if(dir.lengthSq()>1e-4){ dir.normalize();
      const steps = 3;
      const stepDist = (SPEED * dt) / steps;
      for (let s = 0; s < steps; s++) {
        hero.position.addScaledVector(dir, stepDist);
        hero.position.x = Math.max(-lim, Math.min(lim, hero.position.x));
        hero.position.z = Math.max(-lim, Math.min(lim, hero.position.z));
        resolveBlocks(hero.position);
      }
      const targetYaw=Math.atan2(dir.x,dir.z);
      hero.rotation.y+=Math.atan2(Math.sin(targetYaw-hero.rotation.y),Math.cos(targetYaw-hero.rotation.y))*Math.min(1,dt*10);
      moving=true;
    }
  }
  // 걷기
  if(moving)phase+=dt*11;else phase*=0.8;
  const sw=Math.sin(phase)*0.5*(moving?1:0);
  const u=hero.userData; u.legL.rotation.x=sw;u.legR.rotation.x=-sw;u.armL.rotation.x=-sw;u.armR.rotation.x=sw;
  // 가구 두드리는 모션(폴짝 + 팔 톡톡) → 끝나면 문제 열기
  if(acting){ actClock+=dt; const T=0.62,k=Math.min(actClock/T,1);
    hero.position.y=Math.sin(k*Math.PI)*0.9;
    u.armR.rotation.x=-Math.abs(Math.sin(k*Math.PI*3))*1.3;
    u.armL.rotation.x=-Math.abs(Math.sin(k*Math.PI*3))*0.5;
    if(actClock>=T){ acting=false; hero.position.y=0; u.armR.rotation.x=0; u.armL.rotation.x=0;
      const st=pendingSt; pendingSt=null; openStation(st); }
  } else if(hero.position.y!==0){ hero.position.y=0; }
  // 카메라: 캐릭터 어깨 뒤에서 바라보는 방향으로 (부드럽게 정렬 → 멀미 최소)
  { const tgt=hero.rotation.y;
    camYaw += Math.atan2(Math.sin(tgt-camYaw),Math.cos(tgt-camYaw))*Math.min(1,dt*2.2);
    const fx=Math.sin(camYaw), fz=Math.cos(camYaw);
    const dist=5.6, camH=3.7, look=9, lookH=2.4;
    camTmp.set(hero.position.x-fx*dist, camH, hero.position.z-fz*dist);
    const cl=ROOM-0.8; camTmp.x=Math.max(-cl,Math.min(cl,camTmp.x)); camTmp.z=Math.max(-cl,Math.min(cl,camTmp.z)); // 카메라를 방 안에 가둠(벽 밖으로 안 나가게)
    
    // 캐릭터 머리 높이 근처에서 카메라 목표점 방향으로 레이캐스트
    const characterCenter = new THREE.Vector3(hero.position.x, 2.0, hero.position.z);
    const camDir = new THREE.Vector3().subVectors(camTmp, characterCenter);
    const maxDist = camDir.length();
    camDir.normalize();
    
    const camRay = new THREE.Raycaster(characterCenter, camDir, 0.1, maxDist);
    camRay.camera = camera;
    const intersects = camRay.intersectObjects(roomGroup.children, true);
    
    let finalCamPos = camTmp.clone();
    if(intersects.length > 0){
      let hit = null;
      for (const checkHit of intersects) {
        let obj = checkHit.object;
        if (!obj.isMesh) continue; // Points(빛가루) 등 메쉬가 아니면 무시
        
        let isInvalid = false;
        let temp = obj;
        while (temp) {
          if (temp.name === 'star' || temp.name === 'sign' || temp.isSprite || (temp.userData && temp.userData.stationId === 'npc')) {
            isInvalid = true;
            break;
          }
          temp = temp.parent;
        }
        if (!isInvalid) {
          hit = checkHit;
          break;
        }
      }
      if(hit && hit.distance < maxDist){
        const safeDist = Math.max(1.0, hit.distance - 0.4);
        finalCamPos.copy(characterCenter).addScaledVector(camDir, safeDist);
      }
    }
    
    camera.position.lerp(finalCamPos,Math.min(1,dt*8));
    camera.lookAt(hero.position.x+fx*look, lookH, hero.position.z+fz*look); }
  if(dustField)dustField.rotation.y+=dt*0.04;
  // 마커/근접
  let near=null,best=5.5;
  CUR().stations.forEach(st=>{
    const d=Math.hypot(st.x-hero.position.x,(st._z!==undefined?st._z:st.z)-hero.position.z);
    if(!S.done[st.id]&&d<best){best=d;near=st;}
  });
  S.near=near;
  const act=$('#act');
  if(near&&!S.paused){act.style.display='block';act.textContent=(near.build==='npc'?'💬 말 걸기':(near.type==='safe'?'🔐 금고 열기':(IS_TOUCH?'🔍 문제보기':'🔍 문제보기 (E)')));}
  else act.style.display='none';
  // 멀티
  net.acc+=dt; if(net.acc>0.12){net.acc=0;netPublish();}
  netUpdate(dt);
  
  // 조이스틱 표시 여부 제어 (모달, 승리, 인트로, 세팅 화면이 켜져 있을 때는 숨김)
  const stick = $('#stick');
  if (stick) {
    const isOverlayVisible = $('#overlay') && $('#overlay').style.display === 'flex';
    const isWinVisible = $('#win') && $('#win').style.display === 'flex';
    const isSetupVisible = $('#setup') && $('#setup').style.display !== 'none';
    const isIntroVisible = $('#intro') && $('#intro').style.display !== 'none';
    
    const shouldHide = isOverlayVisible || isWinVisible || isSetupVisible || isIntroVisible;
    const targetDisplay = shouldHide ? 'none' : 'block';
    if (stick.style.display !== targetDisplay) {
      stick.style.display = targetDisplay;
    }
    document.body.classList.toggle('modal-open', shouldHide);
  }

  renderer.render(scene,camera);
}
animate();

} /* end start3D */

/* ==================== 퍼즐/금고/승리 (DOM) ==================== */
const norm=s=>(s||'').replace(/\s/g,'').replace(/[.,!?·()]/g,'').toLowerCase();
function closeOverlay(){clearInterval(window.__tt);$('#overlay').style.display='none';S.paused=false;document.body.classList.remove('modal-open');}
window.closeOverlay=closeOverlay;
function openRoomIntro(room){
  S.paused=true;
  document.body.classList.add('modal-open');
  $('#modal').innerHTML=`<div class="k">${room.name} 안내</div>
    <div class="q" style="text-align:center;line-height:1.65;font-size:1.05rem;">
      <b style="color:var(--gold);font-size:1.2rem;">" ${room.concept} "</b>\n\n${room.introText}
    </div>
    <div class="row-btns"><span></span><button class="btn" onclick="closeOverlay()">알겠다</button></div>`;
  $('#overlay').style.display='flex';
}
function josa(w,cons,vowel){const c=(w||'').trim().slice(-1).charCodeAt(0)-0xAC00;return(c<0||c>11171)?vowel:(c%28===0?vowel:cons);}
function openStation(st){
  S.paused=true;
  document.body.classList.add('modal-open');
  if(st.lock&&!S.items.includes(st.lock)){flashModal(st.name,`🔒 굳게 잠겨 있다.<br><b>${st.lock}</b>${josa(st.lock,'이','가')} 있어야 열 수 있다.`);return;}
  if(st.type==='safe'){openSafe();return;}
  if(st.type==='info'){openInfo(st);return;}
  openPuzzle(st);
}
function flashModal(k,html){
  document.body.classList.add('modal-open');
  $('#modal').innerHTML=`<div class="k">${k}</div><div class="q">${html}</div>
  <div class="row-btns"><span></span><button class="btn ghost" onclick="closeOverlay()">닫기</button></div>`;$('#overlay').style.display='flex';}
/* ---- NPC 대화형 퀴즈 ---- */
let chatStation=null, chatBubbles=[], chatOrder=null, chatSolved=false;
function esc(s){return String(s).replace(/</g,'&lt;');}
function rewardText(st){ if(st.reward&&st.reward.slot!==undefined)return `금고의 ‘${['천','백','십','일'][st.reward.slot]}의 자리’는 ${st.reward.val}!`;
  if(st.reward&&st.reward.item)return `${st.reward.item}을(를) 그대에게 주지.`; return ''; }
function applyReward(st){ if(st.reward&&st.reward.slot!==undefined)S.digits[st.reward.slot]=st.reward.val;
  else if(st.reward&&st.reward.item&&!S.items.includes(st.reward.item))S.items.push(st.reward.item); renderHUD(); updateLockStatus(); }
function updateLockStatus(){
  if(typeof CUR==='function'&&CUR()){
    CUR().stations.forEach(st=>{
      if(!S.done[st.id]&&st.lock&&S.items.includes(st.lock)){
        if(st.lockIcon){
          st.group.remove(st.lockIcon);
          st.lockIcon=null;
          if(st.type==='choice'||st.type==='text'||st.type==='safe'){
            const star=buildStar();
            const h=STAR_HEIGHTS[st.build]||3.0;
            star.position.set(0,h,0);
            st.group.add(star);
            st.star=star;
          }
        }
      }
    });
  }
}
function hintRow(){return `<div class="row-btns"><button class="hlink" onclick="npcHint()">힌트 청하기</button><button class="btn ghost" onclick="closeOverlay()">나가기</button></div>`;}
/* 한 글자씩 타이핑 → 참여자가 순서대로 읽게 함 (다 나올 때까지 보기·입력 잠금) */
function typeBubble(el,text,cb){ let i=0; el.textContent=''; clearInterval(window.__tt);
  window.__tt=setInterval(()=>{ el.textContent=text.slice(0,++i); const bb=$('#bubs'); if(bb)bb.scrollTop=bb.scrollHeight;
    if(i>=text.length){clearInterval(window.__tt); cb&&cb();} }, 55); }
function drawChat(){
  const st=chatStation, n=CUR().npc||{name:'지킴이',face:'📜'};
  const last=chatBubbles.length-1;
  const toType=(last>=0 && chatBubbles[last].c!=='me' && !chatBubbles[last].done)?last:-1;
  const typing=toType>=0;
  const activeMe=!typing && !chatSolved && st.type!=='info';
  const shirtHex='#'+(player.shirt>>>0).toString(16).padStart(6,'0');
  const cast=`<div class="cast">
    <div class="por npc ${typing||chatSolved?'on':''}"><div class="ava">${n.face}</div><span>${n.name}</span></div>
    <div class="por me ${activeMe?'on':''}"><div class="ava" style="background:${shirtHex}">🙂</div><span>${esc(player.name)}</span></div></div>`;
  const bubbleHTML=chatBubbles.map((b,i)=>`<div class="bub ${b.c}">${i===toType?'':esc(b.t)}</div>`).join('');
  let foot='';
  if(chatSolved) foot=`<div class="row-btns"><span></span><button class="btn" onclick="closeOverlay()">물러난다</button></div>`;
  else if(st.type==='info') foot=`<div class="row-btns"><span></span><button class="btn" onclick="finishInfo('${st.id}')">알겠다</button></div>`;
  else if(st.type==='choice' || (st.opts && st.opts.length > 0)) foot=`<div class="replies">${chatOrder.map((oi,pos)=>`<button class="reply" onclick="tryChoice('${st.id}',${oi})">${'①②③④'[pos]} ${esc(st.opts[oi])}</button>`).join('')}</div>`+hintRow();
  else foot=`<div class="textrow"><input type="text" id="ans" placeholder="답을 적어 보내기" autocomplete="off"><button class="btn" onclick="tryText('${st.id}')">보내기</button></div>`+hintRow();
  $('#modal').innerHTML=`<div class="vn">${cast}<div class="tag2">${st.k}</div>
    <div class="bubbles" id="bubs">${bubbleHTML}</div>
    <div id="chatfoot"${typing?' style="visibility:hidden"':''}>${foot}</div></div>`;
  const bb=$('#bubs'); if(bb)bb.scrollTop=bb.scrollHeight;
  if(typing){ typeBubble($('#bubs').children[toType], chatBubbles[toType].t, ()=>{chatBubbles[toType].done=true;drawChat();}); }
  else { const inp=$('#ans'); if(inp){inp.focus();inp.addEventListener('keydown',e=>{if(e.key==='Enter')tryText(st.id);});} }
}
function startChat(st){ S.paused=true; document.body.classList.add('modal-open'); chatStation=st; chatSolved=false; chatBubbles=[{c:'npc',t:st.q}];
  if(st.type==='choice' || (st.opts && st.opts.length > 0)){ chatOrder=st.opts.map((_,k)=>k);
    for(let a=chatOrder.length-1;a>0;a--){const b=Math.floor(Math.random()*(a+1));[chatOrder[a],chatOrder[b]]=[chatOrder[b],chatOrder[a]];} }
  drawChat(); $('#overlay').style.display='flex'; }
function openInfo(st){ startChat(st); }
function openPuzzle(st){ startChat(st); }
window.finishInfo=id=>{const st=stById(id); if(!st||st.build!=='npc')markDone(id); closeOverlay();}; // NPC는 done 처리 안 함 → 여러 번 대화
window.npcHint=()=>{ chatBubbles.push({c:'npc',t:'💡 '+(chatStation.hint||'…')}); drawChat(); };
function winReply(st){ chatSolved=true; chatBubbles.push({c:'npc',t:'철컥 — 훌륭하다! '+rewardText(st)}); applyReward(st); drawChat(); markDone(st.id); }
window.tryChoice=(id,k)=>{
  try {
    const st=stById(id);
    if(!st){ console.error("st is null for id:", id); return; }
    if(chatSolved)return;
    if(!st.opts || st.opts[k] === undefined){ console.error("st.opts is invalid for st:", st, "index:", k); return; }
    chatBubbles.push({c:'me',t:st.opts[k]});
    if(k===st.answer) winReply(st);
    else {
      if(!S.wrongCounts) S.wrongCounts={};
      S.wrongCounts[st.id] = (S.wrongCounts[st.id]||0) + 1;
      saveGame();
      if(S.wrongCounts[st.id] >= 3){
        chatSolved = true;
        chatBubbles.push({c:'no',t:'철컥 — 틀렸네. 세 번의 기회를 모두 잃어 탈출에 실패했다!'});
        drawChat();
        setTimeout(()=>{ triggerGameOver(); }, 2000);
      } else {
        chatBubbles.push({c:'no',t:`아니야, 다시 헤아려 보게. (남은 오답 기회: ${3 - S.wrongCounts[st.id]}회)`});
        drawChat();
      }
    }
  } catch(err) {
    console.error("Error in tryChoice:", err);
    alert("오류 발생: " + err.message);
  }
};
function triggerGameOver(){
  localStorage.removeItem('hangeul_escape_save');
  alert("오답 누적으로 탈출에 실패했습니다! 처음부터 다시 시작합니다.");
  location.reload();
}
window.tryText=id=>{
  try {
    const st=stById(id);
    if(!st) return;
    if(chatSolved)return;
    const v=($('#ans')?$('#ans').value:'');
    if(!v.trim())return;
    chatBubbles.push({c:'me',t:v});
    if(st.accept.map(norm).includes(norm(v))) winReply(st);
    else { chatBubbles.push({c:'no',t:'그 답이 아니네. 한 번 더.'}); drawChat(); }
  } catch(err) {
    console.error("Error in tryText:", err);
    alert("오류 발생: " + err.message);
  }
};
function markDone(id){S.done[id]=true;const st=stById(id);if(st){if(st.marker)st.marker.visible=false;if(st.star)st.star.visible=false;} saveGame();}
function openSafe(){let entry='';
  document.body.classList.add('modal-open');
  const render=()=>{$('#modal').innerHTML=`<div class="k">${CUR().name} · 금고</div><div class="q">네 자리 번호를 입력하라.</div>
    <div class="kdisp">${entry.padEnd(4,'·')}</div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="safeKey('${n}')">${n}</button>`).join('')}
      <button onclick="safeKey('back')">⌫</button><button onclick="safeKey('0')">0</button><button onclick="safeKey('ok')">✔</button></div>
    <div class="msg" id="pmsg"></div>
    <div class="row-btns"><span style="color:var(--ink-dim);font-size:.8rem">아는 숫자: ${S.digits.join(' ')}</span>
      <button class="btn ghost" onclick="closeOverlay()">나가기</button></div>`;};
  window.safeKey=k=>{
    if(k==='back')entry=entry.slice(0,-1);
    else if(k==='ok'){ if(entry===CUR().code){closeOverlay();finishRoom();return;}
      render();const m=$('#pmsg');m.className='msg no';m.textContent='철컥… 열리지 않는다.';entry='';return;}
    else if(entry.length<4)entry+=k;
    render();};
  $('#overlay').style.display='flex';render();}
function finishRoom(){ if(progress.room>=ROOMS.length-1)win(); else window.__advance(); }
function makeCode(){const d=new Date(),p=n=>String(n).padStart(2,'0');
  const rnd=Array.from({length:2},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
  return `HG-${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}-${rnd}`;}
function submitSheet(code, duration){
  const sid=($('#sid').value||'').trim(), nm=($('#snm').value||'').trim();
  const msg=$('#sheetMsg');
  if(!sid||!nm){ msg.style.color='var(--no)'; msg.textContent='학번과 이름을 모두 입력하세요.'; return; }
  const btn=$('#sheetBtn'); btn.disabled=true; btn.textContent='제출 중…'; msg.style.color='var(--ink-dim)'; msg.textContent='';
  fetch(CONFIG.SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({studentId:sid,name:nm,code:code,time:new Date().toISOString(),duration:duration})})
   .then(()=>{ msg.style.color='var(--ok)'; msg.innerHTML='✅ 저장되었습니다. 이 화면을 선생님께 보여주세요.'; btn.textContent='제출 완료'; })
   .catch(()=>{ msg.style.color='var(--no)'; msg.textContent='전송 실패 — 인터넷을 확인하고 다시 시도하세요.'; btn.disabled=false; btn.textContent='📋 제출'; });
}
function submitGoogleForm(code, duration){
  const sid=($('#sid').value||'').trim(), nm=($('#snm').value||'').trim();
  const msg=$('#sheetMsg');
  if(!sid||!nm){ msg.style.color='var(--no)'; msg.textContent='학번과 이름을 모두 입력하세요.'; return; }
  const btn=$('#sheetBtn'); btn.disabled=true; btn.textContent='제출 중…'; msg.style.color='var(--ink-dim)'; msg.textContent='';
  const formUrl = CONFIG.FORM_URL.replace(/\/viewform$/, '/formResponse').replace(/\/viewform\?.*/, '/formResponse');
  const fd = new FormData();
  fd.append(CONFIG.FORM_ENTRIES.id, sid);
  fd.append(CONFIG.FORM_ENTRIES.name, nm);
  fd.append(CONFIG.FORM_ENTRIES.code, code);
  fd.append(CONFIG.FORM_ENTRIES.duration, duration);
  fetch(formUrl, {method:'POST',mode:'no-cors',body:fd})
   .then(()=>{ msg.style.color='var(--ok)'; msg.innerHTML='✅ 저장되었습니다. 이 화면을 선생님께 보여주세요.'; btn.textContent='제출 완료'; })
   .catch(()=>{ msg.style.color='var(--no)'; msg.textContent='전송 실패 — 인터넷을 확인하고 다시 시도하세요.'; btn.disabled=false; btn.textContent='📋 제출'; });
}
function win(){
  const elapsedMs = Date.now() - (S.startTime || Date.now());
  document.body.classList.add('modal-open');
  const elapsedMin = Math.floor(elapsedMs / 60000);
  const elapsedSec = Math.floor((elapsedMs % 60000) / 1000);
  const durationStr = `${elapsedMin}분 ${elapsedSec}초`;
  localStorage.removeItem('hangeul_escape_save');
  localStorage.removeItem('hangeul_escape_origStart');
  const code=makeCode();
  $('#wintext').innerHTML=`네 개의 방을 모두 빠져나왔다!<br>1443 창제 · 1446 반포 · 1997 세계유산 등재 · 10월 9일 한글날.<br><b>${player.name}</b>, 너는 훈민정음의 길을 완주했다.<br>(소요 시간: <b>${durationStr}</b>)`;
  $('#wincode').textContent=code;$('#wintime').textContent=new Date().toLocaleString('ko-KR')+' 완주';
  const inpS="flex:1;min-width:0;font:inherit;font-size:1rem;color:var(--ink);background:#1d150c;border:1px solid #4a381f;border-radius:10px;padding:10px 12px";
  if(CONFIG.FORM_URL && CONFIG.FORM_ENTRIES.id){
    $('#winsubmit').innerHTML=`<div style="display:flex;gap:8px;margin-bottom:8px">
        <input id="sid" placeholder="학번" style="${inpS}" autocomplete="off" inputmode="numeric">
        <input id="snm" placeholder="이름" value="${esc(player.name||'')}" style="${inpS}" autocomplete="off"></div>
      <button class="btn" id="sheetBtn" style="width:100%">📋 제출</button>
      <div class="fine" id="sheetMsg"></div>`;
    $('#sheetBtn').onclick=()=>submitGoogleForm(code, durationStr);
  } else if(CONFIG.SHEET_URL){
    $('#winsubmit').innerHTML=`<div style="display:flex;gap:8px;margin-bottom:8px">
        <input id="sid" placeholder="학번" style="${inpS}" autocomplete="off" inputmode="numeric">
        <input id="snm" placeholder="이름" value="${esc(player.name||'')}" style="${inpS}" autocomplete="off"></div>
      <button class="btn" id="sheetBtn" style="width:100%">📋 제출</button>
      <div class="fine" id="sheetMsg"></div>`;
    $('#sheetBtn').onclick=()=>submitSheet(code, durationStr);
  } else {
    $('#winsubmit').innerHTML=`<div class="fine">완주 코드를 선생님께 보여주고 선물을 받으세요.</div>`;
  }
  $('#win').style.display='flex';
  $('#copy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(code);$('#copy').textContent='복사됨!';setTimeout(()=>$('#copy').textContent='코드 복사',1500);};}

/* ---------- 최소 자체 점검 ---------- */
console.assert(norm(' 훈민 정음 ')==='훈민정음','normalize');
ROOMS.forEach(R=>console.assert(
  R.stations.filter(s=>s.reward&&s.reward.slot!==undefined).sort((a,b)=>a.reward.slot-b.reward.slot).map(s=>s.reward.val).join('')===R.code,
  R.name+' 단서 숫자 합성이 금고 코드('+R.code+')와 일치해야'));
console.assert(/^HG-\d{6}-\d{4}-[A-Z0-9]{2}$/.test(makeCode()),'완주코드 형식');
</script>
</body>
</html>
